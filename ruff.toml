# ruff.toml — the lint and format config the gate runs.
#
# Why this file exists instead of ruff's defaults:
#
# 1. Ruff reads the NEAREST config walking up the directory tree. Without one in the repo,
#    whatever sits above the checkout decides what is checked — so the same tree lints
#    differently on the machine you wrote it on and on a clean copy somewhere else.
# 2. This tree arrived with pre-existing findings under ruff's no-config default. The rule
#    set and the exceptions are written down here, one at a time, so turning a rule back on
#    is a visible edit rather than a silent default change.
#
# The rule set is ruff's historical core — E4 imports, E7 statements, E9 syntax, F pyflakes
# — stated explicitly so the verdict does not depend on which ruff release the gate fetched.
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F"]

# The shipped code (`docsum/`) has NO exceptions: `ruff check docsum` is clean under every
# selected rule. The findings below are pre-existing unused imports and locals in seven
# TEST files, and each one is ignored per file rather than globally — a new test file gets
# the full rule set, and the day these seven are cleaned the block is deleted.
#
# Why they are still there: every one of these files also carries formatting drift, and the
# gate's format stage requires a file it touches to be formatted. So removing a one-line
# unused import costs a whole-file reformat — measured at 670 lines across the seven, which
# the 2026-09-20 card deliberately did not spend ("do not mass-reformat"). The exact
# follow-up, when the tree gets formatted on purpose:
#
#     uv run --with ruff ruff check --select F401,F841,F811 --fix tests/
#     uv run --with ruff ruff format tests/
#     # then delete this block
#
[lint.per-file-ignores]
"tests/test_opus5_bugs.py" = ["F401", "F841", "F811"]  # 13 findings, 29 lines of drift
"tests/test_fixes.py" = ["F401", "F841"]               # 5 findings, 166 lines of drift
"tests/test_algorithms.py" = ["F401"]                  # 2 findings, 30 lines of drift
"tests/test_step_processor.py" = ["F401"]              # 1 finding, 78 lines of drift
"tests/test_integration.py" = ["F401"]                 # 1 finding, 107 lines of drift
"tests/test_cli.py" = ["F401"]                         # 1 finding, 252 lines of drift
"tests/test_chunker.py" = ["F401"]                     # 1 finding, 8 lines of drift
