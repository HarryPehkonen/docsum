# ruff.toml — the lint and format config the gate runs.
#
# Why this file exists instead of ruff's defaults:
#
# 1. Ruff reads the NEAREST config walking up the directory tree. Without one in the repo,
#    whatever sits above the checkout decides what is checked — so the same tree lints
#    differently on the machine you wrote it on and on a clean copy somewhere else.
# 2. This tree arrived with 58 pre-existing findings (listed in INCIDENTS.md under "Known
#    lint debt"). The three rules they belong to are named below, one by one, so turning
#    them back on is a visible edit rather than a silent default change.
#
# The rule set is ruff's own default (E4 imports, E7 statements, E9 syntax, F pyflakes)
# with the three rules this tree currently violates switched off. Everything else stays on.
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # 25 findings across the tree: 3 in docsum/ (an unused `re`, an unused `typing.Optional`,
    # an unused `count_tokens`), the rest in tests/. Pre-existing.
    "F401",
    # 7 findings. Six are unused locals in tests/. The seventh is docsum/cli.py:264
    # (`run_stream = args.stream`, never used) — reported as a possible real bug in
    # INCIDENTS.md, not cleaned up by the gate card because fixing it changes behaviour.
    "F841",
    # 2 findings, both in tests/test_opus5_bugs.py, where a name is re-imported inside a
    # test body on purpose (the test asserts on the re-imported binding).
    "F811",
]
