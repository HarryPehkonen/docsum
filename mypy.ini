# mypy.ini — the config the gate's `types` stage looks for.
#
# WHY THIS FILE EXISTS
#   The gate runs mypy only when it finds a config ([tool.mypy] in
#   pyproject.toml, or mypy.ini / .mypy.ini). Until this file existed the stage
#   printed "no [tool.mypy] section — add one when you want types as a gate" and
#   checked nothing, while four findings were already known. Now the stage is
#   real and green (see INCIDENTS.md, 2026-09-20).
#
# WHY THE THREE OVERRIDES
#   openai, tiktoken and tqdm ship no type information, and the gate's
#   `uv run --with mypy` fallback does not install this repo's requirements into
#   mypy's environment — so without these lines the SAME tree reports a different
#   verdict depending on which environment answered:
#       no .venv:  Cannot find implementation or library stub for module named
#                  "openai" / "tiktoken"      [import-not-found]
#       with .venv: Library stubs not installed for "tqdm"     [import-untyped]
#   Neither is a defect in this code. Silencing only those modules keeps the
#   check meaningful everywhere else: the imported names become Any, every other
#   import (and every typo in one) is still reported.
#
# python_version is pinned because the tool is not: the gate fetches mypy with
# `uv run --with mypy`, so its default target would move with each release.
# 3.11 is what this tree has actually been run under.
#
# This is the default rule set, not `--strict`. Turning strictness on is a
# separate decision with its own debt list, measured before it is adopted.

[mypy]
python_version = 3.11

[mypy-openai,openai.*]
ignore_missing_imports = True

[mypy-tiktoken,tiktoken.*]
ignore_missing_imports = True

[mypy-tqdm,tqdm.*]
ignore_missing_imports = True
